<!-- === Paygilant Web SDK: session-id bridge ===
     Paygilant calls window.sfCallback(id) when ready; we mirror it into
     localStorage so the Flutter app can read it without JS interop.        -->
<script type="text/javascript">
  (function () {
    function store(id) {
      if (id && id !== 'no_session_id') {
        try { window.localStorage.setItem('pg_fms_sid', id); } catch (e) {}
      }
    }
    window.sfCallback = function (id) { store(id); };          // push
    var tries = 0;                                            // pull fallback
    var iv = setInterval(function () {
      tries++;
      if (typeof window.sfGetSessionId === 'function') { store(window.sfGetSessionId()); }
      if (tries > 60) clearInterval(iv);                      // ~30s cap
    }, 500);
  })();
</script>


<!-- === Paygilant Web SDK loader (from Paygilant's guide) === -->
<script type="text/javascript">
  !(function (w, d) {
    var s = d.createElement("script"),
        qp = "r=" + Math.random() + "&t=" + (new Date()).getTime();

    s.type = "text/javascript"; s.async = true;
    d.getElementsByTagName("head")[0].appendChild(s);
  })(window, document);
</script>


<!-- Application wrapper -->

window.getPaygilantSessionId = function () {

  }

};
</script>
